<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工脉 · 工业设备知识中枢</title>
<script src="/web/echarts.min.js"></script>
<style>
  :root{
    --bg:#0a0e16; --panel:#111826; --panel-2:#0d1420; --line:#1e293b; --line-2:#283548;
    --ink:#e6edf6; --ink-2:#aab8cc; --muted:#7d8ca3; --faint:#5a6a82;
    --accent:#f59e0b; --accent-2:#fbbf24; --accent-dim:rgba(245,158,11,.14);
    --ok:#10b981; --fail:#ef4444; --warn:#f59e0b;
    --p0:#dc2626; --p1:#ea580c; --p2:#ca8a04; --p3:#0d9488;
    --glow:0 0 22px rgba(245,158,11,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
       background-image:linear-gradient(rgba(148,163,184,.035) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(148,163,184,.035) 1px,transparent 1px);
       background-size:44px 44px}
  .app{display:flex;min-height:100vh;position:relative;z-index:1}

  /* ---------- 侧栏 ---------- */
  aside{width:216px;background:linear-gradient(180deg,#070b12,#0d1420);color:#94a3b8;
        padding:24px 0 16px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;
        border-right:1px solid var(--line)}
  .brand{padding:0 22px 20px;border-bottom:1px solid var(--line);position:relative}
  .brand:after{content:"";position:absolute;left:22px;bottom:-1px;width:44px;height:2px;
               background:linear-gradient(90deg,var(--accent),transparent)}
  .brand h1{margin:0;font-size:22px;letter-spacing:3px;color:#fff;font-weight:800}
  .brand h1 b{color:var(--accent);text-shadow:0 0 14px rgba(245,158,11,.55)}
  .brand p{margin:7px 0 0;font-size:11px;color:var(--faint);letter-spacing:1px}
  nav{padding:16px 12px;flex:1}
  .nav-cap{font-size:10.5px;letter-spacing:2px;color:var(--faint);padding:0 12px;margin:2px 0 8px}
  nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:8px;
        color:#8fa0b8;text-decoration:none;font-size:13.5px;margin-bottom:4px;cursor:pointer;
        transition:.16s;position:relative}
  nav a:hover{background:rgba(148,163,184,.07);color:#dbe4f0}
  nav a.on{background:linear-gradient(90deg,rgba(245,158,11,.16),rgba(245,158,11,.04));
           color:#fff;font-weight:600}
  nav a.on:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
                  background:var(--accent);border-radius:2px;box-shadow:0 0 8px rgba(245,158,11,.8)}
  nav a .ic{width:17px;text-align:center;font-size:13px;opacity:.9}
  .side-foot{padding:14px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.8}
  .side-foot .live{color:var(--ok)}
  .side-foot .live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
                          background:var(--ok);margin-right:6px;box-shadow:0 0 6px var(--ok);
                          animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- 主区 ---------- */
  main{margin-left:216px;flex:1;padding:0 30px 48px;max-width:1260px}
  header{position:sticky;top:0;z-index:20;background:rgba(10,14,22,.88);
         backdrop-filter:blur(8px);padding:18px 0 13px;margin-bottom:10px;
         border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
  header h2:before{content:"▍";color:var(--accent);margin-right:4px}
  header .sub{color:var(--muted);font-size:12.5px}
  .pill{background:var(--accent-dim);color:var(--accent-2);border:1px solid rgba(245,158,11,.3);
        border-radius:20px;padding:2px 12px;font-size:11.5px}
  .view{display:none;animation:fade .22s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- 通用组件 ---------- */
  .grid{display:grid;gap:14px}
  .col-4{grid-template-columns:repeat(4,1fr)}
  .col-2{grid-template-columns:1.5fr 1fr}
  .col-2e{grid-template-columns:1fr 1fr}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));
        border:1px solid var(--line);border-radius:12px;padding:18px 20px;
        box-shadow:0 4px 24px rgba(0,0,0,.28)}
  .card h3{margin:0 0 14px;font-size:13.5px;font-weight:700;color:var(--ink-2);
           display:flex;align-items:center;gap:9px;letter-spacing:.5px}
  .card h3:before{content:"";width:3px;height:14px;background:var(--accent);
                  border-radius:2px;box-shadow:0 0 6px rgba(245,158,11,.6)}
  .kpi{background:linear-gradient(160deg,#131c2c,#0d1420);border:1px solid var(--line-2);
       border-radius:12px;padding:18px 20px;position:relative;overflow:hidden;
       transition:.18s}
  .kpi:hover{border-color:rgba(245,158,11,.45);box-shadow:var(--glow);transform:translateY(-2px)}
  .kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:2px;
              background:linear-gradient(90deg,var(--accent),transparent 70%)}
  .kpi .n{font-size:32px;font-weight:800;letter-spacing:-1px;
          font-family:ui-monospace,Consolas,monospace;color:#fff;
          text-shadow:0 0 16px rgba(245,158,11,.25)}
  .kpi .n small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:3px}
  .kpi .l b{color:var(--accent-2);font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:600;color:var(--faint);font-size:11px;letter-spacing:1px;
     padding:0 10px 9px;border-bottom:1px solid var(--line-2);text-transform:uppercase}
  td{padding:10px;border-bottom:1px solid #16202f;color:var(--ink-2)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(148,163,184,.05)}
  td b{color:var(--ink)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .dot.ok{background:var(--ok);box-shadow:0 0 6px rgba(16,185,129,.7)}
  .dot.fail{background:var(--fail);box-shadow:0 0 6px rgba(239,68,68,.7)}
  .lv{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:1px 8px;
      font-size:11px;font-weight:700;color:#fff;font-family:ui-monospace,monospace;
      box-shadow:0 0 8px rgba(0,0,0,.4) inset}
  .lv.P0{background:var(--p0)} .lv.P1{background:var(--p1)}
  .lv.P2{background:var(--p2)} .lv.P3{background:var(--p3)}
  .tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:4px;
       background:#1a2436;color:#9fb2cc;border:1px solid #263349}
  .tag.manual{background:rgba(13,148,136,.14);color:#2dd4bf;border-color:rgba(13,148,136,.35)}
  .tag.workorder{background:rgba(245,158,11,.12);color:var(--accent-2);border-color:rgba(245,158,11,.3)}
  .tag.knowledge{background:rgba(99,102,241,.14);color:#a5b4fc;border-color:rgba(99,102,241,.35)}

  /* ---------- 问答 ---------- */
  .ask-box{display:flex;gap:10px;margin-bottom:14px}
  .ask-box input{flex:1;padding:13px 16px;border:1px solid var(--line-2);border-radius:9px;
                 font-size:14px;font-family:inherit;outline:none;background:#0b111c;color:var(--ink)}
  .ask-box input::placeholder{color:var(--faint)}
  .ask-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
  .btn{background:linear-gradient(135deg,#b45309,#d97706);color:#fff;border:none;
       padding:0 26px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
       font-family:inherit;transition:.16s;box-shadow:0 2px 14px rgba(217,119,6,.3)}
  .btn:hover{filter:brightness(1.15)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{background:#0b111c;border:1px solid var(--line-2);border-radius:18px;padding:6px 14px;
        font-size:12.5px;color:#9fb2cc;cursor:pointer;transition:.16s}
  .chip:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-dim)}
  .answer{border-left:3px solid var(--accent);background:rgba(245,158,11,.06);
          padding:16px 18px;border-radius:0 10px 10px 0;margin-bottom:18px;
          font-size:14.5px;line-height:1.85;color:var(--ink)}
  .answer .meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap}
  .answer .meta span:before{content:"◆";color:var(--accent);font-size:8px;vertical-align:2px;margin-right:5px}
  .refuse{border-left-color:var(--fail);background:rgba(239,68,68,.07)}
  .ev{background:#0c1220;border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px}
  .ev .h{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
  .ev .t{font-weight:600;font-size:13px;color:var(--ink)}
  .page{background:rgba(245,158,11,.15);color:var(--accent-2);border:1px solid rgba(245,158,11,.35);
        font-size:11px;padding:1px 9px;border-radius:4px;font-family:ui-monospace,monospace}
  .ev .s{color:#8fa0b8;font-size:12.8px;line-height:1.75;
         display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .kv span{background:#131c2c;border:1px solid var(--line-2);border-radius:5px;
           padding:2px 10px;font-size:11.5px;color:#aebdd2}
  .kv span b{color:var(--accent-2);font-weight:600}

  /* ---------- 知识库 ---------- */
  .doc{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
       border-radius:10px;padding:14px 16px;cursor:pointer;transition:.16s;margin-bottom:10px}
  .doc:hover{border-color:rgba(245,158,11,.5);box-shadow:var(--glow)}
  .doc .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .doc .name{font-weight:600;font-size:13.5px;color:var(--ink)}
  .doc .sec{margin-top:9px;color:var(--muted);font-size:12.2px;line-height:1.8}

  .modal{position:fixed;inset:0;background:rgba(4,7,12,.72);display:none;z-index:99;
         align-items:center;justify-content:center;padding:40px;backdrop-filter:blur(4px)}
  .modal.on{display:flex}
  .modal .box{background:#0e1524;border:1px solid var(--line-2);border-radius:14px;
              max-width:900px;width:100%;max-height:82vh;overflow:auto;padding:26px 30px;
              box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 4px;font-size:17px;color:#fff}
  .modal .close{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .sec-item{border-top:1px solid var(--line);padding:13px 0}
  .sec-item .st{font-weight:600;font-size:13px;display:flex;gap:9px;align-items:center;color:var(--ink)}
  .sec-item p{margin:7px 0 0;font-size:12.8px;color:#8fa0b8;white-space:pre-wrap}

  /* ---------- 图谱 ---------- */
  #graph{width:100%;height:560px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;font-size:12px;color:#8fa0b8}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

  /* ---------- 诊断 ---------- */
  .impact{border-radius:14px;padding:24px 28px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;
          background:linear-gradient(120deg,#450a0a,#b42318);box-shadow:0 8px 30px rgba(180,35,24,.3)}
  .impact.P1{background:linear-gradient(120deg,#431407,#c2410c);box-shadow:0 8px 30px rgba(194,65,12,.3)}
  .impact.P2{background:linear-gradient(120deg,#422006,#a16207);box-shadow:0 8px 30px rgba(161,98,7,.25)}
  .impact.P3{background:linear-gradient(120deg,#042f2e,#0f766e);box-shadow:0 8px 30px rgba(15,118,110,.25)}
  .impact:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
                border-radius:50%;background:rgba(255,255,255,.06)}
  .impact .big{font-size:38px;font-weight:800;letter-spacing:1px;font-family:ui-monospace,monospace;
               text-shadow:0 0 20px rgba(255,255,255,.3)}
  .impact .t1{font-size:12px;opacity:.85;letter-spacing:1.5px}
  .impact .t2{font-size:14.5px;margin-top:8px;max-width:820px;line-height:1.7}
  .steps ol{margin:0;padding-left:20px}
  .steps li{margin-bottom:9px;font-size:13.3px;color:#aebdd2}
  .steps li::marker{color:var(--accent);font-weight:700}
  .empty{color:var(--faint);font-size:13px;padding:26px;text-align:center}
  .flow{flex-wrap:wrap;background:#0c1220;border:1px solid var(--line);border-radius:10px;
        padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:10px;
        font-size:12.5px;color:var(--muted);overflow-x:auto}
  .flow b{color:var(--ink)}
  .arrow{color:var(--accent);font-weight:700}
  .chart{width:100%;height:250px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>工<b>脉</b></h1>
      <p>工业设备知识中枢 v0.1</p>
    </div>
    <nav>
      <div class="nav-cap">知识资产</div>
      <a class="on" data-v="dash"><span class="ic">▦</span>运行概览</a>
      <a data-v="docs"><span class="ic">▤</span>设备知识库</a>
      <div class="nav-cap">智能应用</div>
      <a data-v="ask"><span class="ic">◈</span>证据化问答</a>
      <a data-v="graph"><span class="ic">◉</span>知识图谱</a>
      <a data-v="diag"><span class="ic">⚠</span>故障诊断</a>
    </nav>
    <div class="side-foot">
      <div class="live">引擎在线 · 只读模式</div>
      <div>每条结论可溯源至页码</div>
      <div id="builtAt" style="margin-top:8px;color:#475569"></div>
    </div>
  </aside>

  <main>
    <header>
      <h2 id="pageTitle">运行概览</h2>
      <span class="sub" id="siteName"></span>
      <span class="pill">演练环境 · 非真实产线</span>
    </header>

    <!-- 概览 -->
    <section class="view on" id="v-dash">
      <div class="grid col-4" style="margin-bottom:14px" id="kpis"></div>
      <div class="grid col-2">
        <div class="card">
          <h3>设备台账与实时状态</h3>
          <table id="assetTable"><tbody><tr><td class="empty">加载中…</td></tr></tbody></table>
        </div>
        <div class="card">
          <h3>现场健康度</h3>
          <div id="healthChart" class="chart"></div>
        </div>
      </div>
      <div class="grid col-2e" style="margin-top:14px">
        <div class="card">
          <h3>巡检时延分布（ms，越低越好）</h3>
          <div id="latencyChart" class="chart"></div>
        </div>
        <div class="card">
          <h3>巡检证据链</h3>
          <div id="flowLine" class="flow"></div>
          <table id="evTable"><tbody><tr><td class="empty">加载中…</td></tr></tbody></table>
        </div>
      </div>
    </section>

    <!-- 知识库 -->
    <section class="view" id="v-docs">
      <div class="flow">
        <b>知识来源</b><span class="arrow">→</span>设备手册 PDF（页码级解析）
        <span class="arrow">→</span>维修工单（结构化归档）
        <span class="arrow">→</span>故障模式知识库（机理约束）
        <span class="arrow">→</span>统一检索与证据溯源
      </div>
      <div id="docList"></div>
    </section>

    <!-- 问答 -->
    <section class="view" id="v-ask">
      <div class="card" style="margin-bottom:16px">
        <h3>用现场语言提问，答案必须带证据</h3>
        <div class="ask-box">
          <input id="q" placeholder="例如：焊装线多台机器人同时掉站，交换机 CRC 计数激增，怎么排查？"
                 onkeydown="if(event.key==='Enter')doAsk()">
          <button class="btn" onclick="doAsk()">检索并作答</button>
        </div>
        <div class="chips" id="chips"></div>
        <div id="askOut"></div>
      </div>
    </section>

    <!-- 图谱 -->
    <section class="view" id="v-graph">
      <div class="card" style="padding:14px 16px">
        <h3>现象 — 根因 — 处置 关系网（每条边带页码证据）</h3>
        <div id="graph"></div></div></section>

    <!-- 诊断 -->
    <section class="view" id="v-diag">
      <div id="diagOut"></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="box">
    <span class="close" onclick="closeModal()">×</span>
    <h3 id="mTitle"></h3>
    <div style="color:var(--muted);font-size:12px;margin-bottom:10px" id="mMeta"></div>
    <div id="mBody"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pageName = {dash:'运行概览', docs:'设备知识库', ask:'证据化问答', graph:'知识图谱', diag:'故障诊断'};

document.querySelectorAll('nav a').forEach(a => a.onclick = () => {
  document.querySelectorAll('nav a').forEach(x => x.classList.remove('on'));
  a.classList.add('on');
  const v = a.dataset.v;
  document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
  $('#v-' + v).classList.add('on');
  $('#pageTitle').textContent = pageName[v];
  if (v === 'graph') setTimeout(drawGraph, 60);
});

async function api(url, opt) {
  const r = await fetch(url, opt);
  return r.json();
}

/* ---------- 概览 ---------- */
const charts = {};
function chartOf(id){
  if (!charts[id]) charts[id] = echarts.init($('#' + id));
  return charts[id];
}
async function loadDash() {
  const [st, dg] = await Promise.all([api('/api/stats'), api('/api/diagnose')]);
  $('#siteName').textContent = st.site || '';
  $('#builtAt').textContent = '索引构建 ' + (st.built_at || '');
  const kpis = [
    ['设备手册', st.manuals, '份', st.pages + ' 页可解析'],
    ['维修工单', st.workorders, '份', '结构化归档'],
    ['知识片段', st.chunks, '条', '页码级切分'],
    ['图谱关系', st.edges, '条', '每条带证据'],
  ];
  $('#kpis').innerHTML = kpis.map(([l, n, unit, sub]) =>
    `<div class="kpi"><div class="n">${n}<small>${unit}</small></div>
     <div class="l">${l} · <b>${sub}</b></div></div>`).join('');

  $('#assetTable').innerHTML = `<thead><tr><th>设备</th><th>协议</th><th>产线</th><th>影响</th><th>状态</th></tr></thead>
    <tbody>${dg.assets.map(a => `<tr>
      <td><b>${esc(a.name)}</b><div class="mono" style="color:#5a6a82;font-size:11px">${esc(a.host)}</div></td>
      <td>${esc(a.protocol)}</td><td>${esc(a.line)}</td>
      <td><span class="lv ${a.impact}">${a.impact}</span></td>
      <td><span class="dot ${a.status === 'ok' ? 'ok' : 'fail'}"></span>${a.status === 'ok' ? '正常' : a.status === 'fail' ? '异常' : '未检测'}</td>
    </tr>`).join('')}</tbody>`;

  $('#flowLine').innerHTML = ['采集', '证据结构化', '知识检索', '分层定位', '影响分级', '处置归档']
    .map((x, i) => (i ? '<span class="arrow">→</span>' : '') + `<b>${x}</b>`).join(' ');

  $('#evTable').innerHTML = `<thead><tr><th>目标</th><th>检测</th><th>结果</th><th>时延</th></tr></thead>
    <tbody>${dg.evidence.map(e => `<tr>
      <td>${esc(e.name)}</td><td class="mono">${esc(e.check_type)}</td>
      <td><span class="dot ${e.ok ? 'ok' : 'fail'}"></span>${e.ok ? '通过' : '<b style="color:#ef4444">失败</b>'}</td>
      <td class="mono">${e.latency != null ? e.latency + ' ms' : '—'}</td>
    </tr>`).join('')}</tbody>`;

  /* 现场健康度环图：巡检通过/失败真实占比 */
  const okN = dg.evidence.filter(e => e.ok).length, failN = dg.evidence.length - okN;
  chartOf('healthChart').setOption({
    tooltip: {trigger: 'item'},
    series: [{
      type: 'pie', radius: ['58%', '78%'], center: ['50%', '50%'],
      label: {show: false},
      data: [
        {name: '通过', value: okN, itemStyle: {color: '#10b981'}},
        {name: '失败', value: failN, itemStyle: {color: '#ef4444'}},
      ],
    }],
    graphic: [{type: 'text', left: 'center', top: '42%',
      style: {text: Math.round(okN / (okN + failN) * 100) + '%', fill: '#fff', fontSize: 30,
              fontWeight: 'bold', fontFamily: 'Consolas, monospace'}},
      {type: 'text', left: 'center', top: '58%',
      style: {text: '巡检通过率 · ' + okN + '/' + (okN + failN) + ' 项', fill: '#7d8ca3', fontSize: 12}}],
  });

  /* 时延条形图：真实巡检数据 */
  const lats = dg.evidence.filter(e => e.latency != null).sort((a, b) => b.latency - a.latency);
  chartOf('latencyChart').setOption({
    tooltip: {trigger: 'axis', axisPointer: {type: 'shadow'}},
    grid: {left: 110, right: 40, top: 8, bottom: 24},
    xAxis: {type: 'value', axisLabel: {color: '#7d8ca3', fontSize: 11},
            splitLine: {lineStyle: {color: '#1e293b'}}},
    yAxis: {type: 'category',
            data: lats.map(e => e.name),
            axisLabel: {color: '#aab8cc', fontSize: 12},
            axisLine: {lineStyle: {color: '#283548'}}},
    series: [{
      type: 'bar', barWidth: 14,
      data: lats.map(e => ({value: e.latency,
        itemStyle: {color: e.ok ? '#0d9488' : '#ef4444', borderRadius: [0, 7, 7, 0]}})),
      label: {show: true, position: 'right', color: '#7d8ca3', fontSize: 11,
              formatter: p => p.value + ' ms'},
    }],
  });
}

/* ---------- 知识库 ---------- */
const tagName = {manual:'设备手册', workorder:'维修工单', knowledge:'知识库'};
async function loadDocs() {
  const {docs} = await api('/api/docs');
  $('#docList').innerHTML = docs.map(d => `<div class="doc" onclick="openDoc('${d.doc_id}')">
    <div class="r1"><span class="name">${esc(d.title)}</span>
      <span class="tag ${d.type}">${tagName[d.type] || d.type}</span></div>
    <div class="sec">${d.type === 'manual' ? d.pages + ' 页 · ' : ''}${d.chunks} 个知识片段${d.sections.length ? ' · ' + d.sections.slice(0, 3).map(esc).join(' / ') : ''}</div>
  </div>`).join('');
}
async function openDoc(id) {
  const d = await api('/api/docs/' + id);
  $('#mTitle').textContent = d.title;
  $('#mMeta').textContent = (tagName[d.type] || d.type) + ' · 共 ' + d.chunks.length + ' 个片段 · 每个片段可回指页码';
  $('#mBody').innerHTML = d.chunks.map(c => `<div class="sec-item">
      <div class="st">${c.page ? '<span class="page">第 ' + c.page + ' 页</span>' : '<span class="page">' + (tagName[d.type] || '') + '</span>'}
      ${esc(c.section || '正文')}</div>
      <p>${esc(c.text.slice(0, 420))}${c.text.length > 420 ? '…' : ''}</p>
    </div>`).join('');
  $('#modal').classList.add('on');
}
function closeModal(){ $('#modal').classList.remove('on'); }

/* ---------- 问答 ---------- */
const EXAMPLES = [
  '焊装线多台机器人同时掉站，交换机 CRC 计数激增，怎么排查？',
  'PLC 的 102 端口能连上，但读写一直超时',
  '包装线视觉工位周期性丢包，8 秒后自愈',
  'Modbus 读到的数据整体错位一格',
  '总装线主 PLC 新连接全部被拒，老连接正常',
];
$('#chips').innerHTML = EXAMPLES.map(q => `<span class="chip" onclick="$('#q').value=this.textContent;doAsk()">${esc(q)}</span>`).join('');

async function doAsk() {
  const q = $('#q').value.trim();
  if (q.length < 2) return;
  $('#askOut').innerHTML = '<div class="empty">检索中…</div>';
  const r = await api('/api/ask', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q, top_k: 5})
  });
  const kv = (label, arr, cls) => arr && arr.length
    ? `<div class="kv">${arr.map(x => `<span><b>${label}</b> · ${esc(x)}</span>`).join('')}</div>` : '';
  $('#askOut').innerHTML = `
    <div class="answer ${r.answered ? '' : 'refuse'}">
      <div class="meta">
        <span>作答模式：${r.mode === 'refused' ? '证据不足·拒答' : '证据约束作答'}</span>
        <span>置信度：${(r.confidence * 100).toFixed(0)}%</span>
        <span>引用证据：${r.evidence.length} 条</span>
      </div>
      ${esc(r.answer)}
      ${kv('机理', r.causes)}${kv('处置', r.remedies)}${kv('影响等级', r.safety)}
    </div>
    <h3 style="font-size:13px;color:var(--muted);margin:0 0 10px">证据清单（每条可回指文档与页码）</h3>
    ${r.evidence.map((e, i) => `<div class="ev">
      <div class="h">
        <span class="tag ${e.doc_type}">${tagName[e.doc_type] || e.doc_type}</span>
        <span class="t">${esc(e.doc_title)}</span>
        ${e.page ? `<span class="page">第 ${e.page} 页</span>` : ''}
        <span style="color:#5a6a82;font-size:11.5px">相关度 ${e.score} · 证据 ${i + 1}</span>
      </div>
      ${e.section ? `<div style="color:var(--accent-2);font-size:12px;margin-bottom:4px">${esc(e.section)}</div>` : ''}
      <div class="s">${esc(e.snippet)}</div>
    </div>`).join('')}`;
}

/* ---------- 图谱 ---------- */
let chart = null;
async function drawGraph() {
  const g = await api('/api/graph');
  if (!chart) chart = echarts.init($('#graph'));
  const typeColor = {symptom:'#ef4444', cause:'#fb923c', remedy:'#2dd4bf',
                     equipment:'#60a5fa', component:'#94a3b8',
                     manual:'#38bdf8', workorder:'#fbbf24', safety:'#eab308'};
  const typeName = {symptom:'故障现象', cause:'根因', remedy:'处置措施', equipment:'设备',
                    component:'部件', manual:'设备手册', workorder:'维修工单', safety:'安全等级'};
  const nodes = [], links = [];
  const seen = new Set();
  Object.entries(g.nodes).forEach(([type, arr]) => arr.forEach(n => {
    const id = type + ':' + n;
    if (seen.has(id)) return;
    seen.add(id);
    nodes.push({id, name: n, category: type,
      symbolSize: type === 'symptom' || type === 'cause' ? 26 : 18,
      itemStyle: {color: typeColor[type] || '#94a3b8'}});
  }));
  g.edges.forEach(e => {
    const s = e.source_type + ':' + e.source, t = e.target_type + ':' + e.target;
    if (!seen.has(s) || !seen.has(t)) return;
    links.push({source: s, target: t, value: e.relation,
      lineStyle: {width: Math.min(3, 1 + e.weight * 0.4), opacity: .45, curveness: .12},
      tooltip: {formatter: () => `<b>${esc(e.relation)}</b><br>${esc(e.doc_title)}${e.page ? ' 第 ' + e.page + ' 页' : ''}<br><span style="color:#94a3b8">${esc(e.evidence)}</span>`}});
  });
  const cats = Object.keys(g.nodes).filter(k => g.nodes[k].length).map(k => ({name: typeName[k] || k}));
  chart.setOption({
    tooltip: {trigger: 'item', confine: true, backgroundColor: '#0e1524',
              borderColor: '#283548', textStyle: {color: '#e6edf6'}},
    legend: [{data: cats.map(c => c.name), bottom: 0, textStyle: {fontSize: 11, color: '#8fa0b8'}}],
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true,
      data: nodes.map(n => ({...n, category: cats.findIndex(c => c.name === (typeName[n.category] || n.category))})),
      links, categories: cats,
      force: {repulsion: 260, edgeLength: [70, 150], gravity: .08},
      label: {show: true, fontSize: 11, color: '#cbd5e1', position: 'right'},
      emphasis: {focus: 'adjacency', lineStyle: {width: 3}},
      lineStyle: {color: 'source'}
    }]
  });
}
